# APAP AI Gateway — OpenAPI 3.1 定義
#
# 対象は docs/design/13_API設計.md（13.1 エンドポイント / 13.2 Request / 13.3 Response /
# 13.4 Error / 13.5 HTTP Status）。設計書は編集しない方針のため、本ファイルが
# 「実装が実際に何を提供しているか」を表す唯一のAPI定義になる。
#
# **手で書き換えないこと。** paths は gateway の EndpointCatalog を単一の情報源として
# おり、両者の一致は OpenApiContractTest が機械検証する（乖離するとビルドが落ちる）。
#
# 提供していないエンドポイントも**definitionから消さない**。`x-apap-status: NOT_IMPLEMENTED`
# を付けて残す（ADR-0027）。消すと「そんなAPIは無い」ことになり、
# 「13.1にはあるがこのビルドでは未提供」という実際の状態を表現できなくなる。
openapi: 3.1.0
info:
  title: APAP AI Gateway
  version: "1.0.0"
  description: |
    AI Provider Abstraction Platform の HTTP API。

    Vendor Neutral 原則（CLAUDE.md 不変条件3）により、リクエストで Provider / Model の
    物理名を指定することはできず、応答にも既定で含まれない。利用側が指定できるのは
    Capability と Model Alias のみ。
servers:
  - url: /
security:
  - bearerAuth: []
paths:
