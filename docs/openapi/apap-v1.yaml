components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        CIAP が発行した JWT（13章共通事項）。検証は TokenVerifier（腐敗防止層、ADR-0004）
        の背後で行われ、クレーム名は設定駆動。
  responses:
    Ok:
      description: 同期成功（13.5）。SSE も 200 で開始する。
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChatResponse" }
        text/event-stream:
          schema:
            type: string
            description: |
              `stream=true` のときの SSE ストリーム（13.3）。イベント名は
              message_start / content_delta / tool_call_delta / usage / message_end /
              error / heartbeat。heartbeat は 15 秒間隔（2.10）。
              message_end に finish_reason は含まれない（ADR-0028）。
    Created:
      description: 作成成功（13.5）。
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/json:
          schema: { type: object }
    Problem:
      description: |
        エラー応答（13.4、RFC 9457 Problem Details + APAP 拡張）。
        429 / 503 には Retry-After ヘッダも付く（13.5）。
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After:
          description: 429 / 503 のときのみ。秒単位の整数（RFC 9110）。
          required: false
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
  headers:
    XRequestId:
      description: 全応答に付与される（13.5）。ULID 形式。
      required: true
      schema: { type: string }
  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, request_id, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { $ref: "#/components/schemas/ErrorCode" }
        detail: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
        retry_after_ms:
          type: integer
          description: レート制限時などの再試行猶予。無い場合は省略される。
    ErrorCode:
      type: string
      description: |
        13.4 のエラーコード体系。NOT_IMPLEMENTED（ADR-0027）と
        RESOURCE_NOT_FOUND（ADR-0030）のみ Gateway 側の追加。
      enum:
            - INVALID_REQUEST
            - PROMPT_VALIDATION_FAILED
            - UNAUTHENTICATED
            - PERMISSION_DENIED
            - CAPABILITY_NOT_AVAILABLE
            - ALIAS_NOT_FOUND
            - CONVERSATION_NOT_FOUND
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - CONTEXT_LENGTH_EXCEEDED
            - OUTPUT_SCHEMA_VIOLATION
            - CONTENT_FILTERED
            - RATE_LIMIT_EXCEEDED
            - QUOTA_EXCEEDED
            - INTERNAL_ERROR
            - PROVIDER_ERROR
            - NO_CANDIDATE_AVAILABLE
            - TIMEOUT
            - NOT_IMPLEMENTED
            - RESOURCE_NOT_FOUND
    ContentPart:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, image, audio, video, json] }
        text: { type: string }
        uri: { type: string }
        mime_type: { type: string }
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string }
        content:
          type: array
          items: { $ref: "#/components/schemas/ContentPart" }
    ChatRequest:
      type: object
      required: [messages]
      description: |
        13.2 POST /v1/chat。Provider / Model の物理名を指定するフィールドは
        意図的に存在しない（CLAUDE.md 不変条件3）。
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/Message" }
        model_alias: { type: string }
        params: { $ref: "#/components/schemas/GenerationParams" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolDefinition" }
        output_schema: { type: string }
        stream: { type: boolean, default: false }
        conversation_id: { type: string }
        session_id: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
    EmbeddingRequest:
      type: object
      required: [inputs]
      description: 13.2 POST /v1/embeddings。
      properties:
        inputs:
          type: array
          minItems: 1
          items: { type: string }
        model_alias: { type: string }
        dimensions: { type: integer }
    GenerationParams:
      type: object
      properties:
        temperature: { type: number }
        max_tokens: { type: integer }
        top_p: { type: number }
        stop: { type: array, items: { type: string } }
        seed: { type: integer }
    ToolDefinition:
      type: object
      required: [name, description, input_schema]
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: string }
    Usage:
      type: object
      required: [input_tokens, output_tokens, total_tokens, estimated]
      properties:
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated: { type: boolean }
    Cost:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }
    ToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id: { type: string }
        name: { type: string }
        arguments: { type: object }
    ChatResponse:
      type: object
      required: [response_id, request_id, output, finish_reason, usage, cost, cached]
      description: |
        13.3。物理 Provider / Model 名は含まれない（13.3 注、CLAUDE.md 不変条件3）。
        返るのは利用側が指定した Alias（論理名）のみ。
      properties:
        response_id: { type: string }
        request_id: { type: string }
        output:
          type: object
          required: [message]
          properties:
            message: { $ref: "#/components/schemas/Message" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }
        finish_reason: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
        cost: { $ref: "#/components/schemas/Cost" }
        cached: { type: boolean }
        model_alias: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
