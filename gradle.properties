org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.incremental=true
# Gradle 9.4.1自身のkotlin-dslアクセサ生成が、build-logicが適用するapplication
# コアプラグイン由来の accessor で、Gradle内部で既に整理対象になっているAPI
# （ApplicationPluginConvention / DefaultArtifactPublicationSet）を参照するコードを
# 生成し、build-logic:compileKotlinが自己矛盾でUnresolved referenceになる事象を回避する。
# build-logic自身のコードの問題ではない。詳細はADR-0024参照。
systemProp.org.gradle.kotlin.dsl.precompiled.accessors.strict=false
