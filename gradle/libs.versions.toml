[versions]
# 2.4.10へ安易に上げない: Gradle 9.4.1のprecompiled script plugin（build-logic）
# ツールチェーンが2.4.10で破綻することを確認済み（CLAUDE.md「トラブルシューティング
# （Gradleビルドキャッシュ）」参照）。上げる場合はGradle側のKotlin DSLサポート
# バージョンとの適合を先に確認すること。
kotlin = "2.3.21"
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
kover = "0.9.9"
foojay-resolver = "1.0.0"
konsist-lib = "0.17.3"
junit = "6.1.3"
slf4j = "2.0.18"
kotlinx-coroutines = "1.9.0"
# JSON Schema検証: apap-provider CapabilityRegistryがテナントのリクエスト/レスポンスペイロード
# （攻撃者到達可能な入力境界）を検証する。自前実装はしない。networknt/json-schema-validatorは
# 公式JSON Schema Test Suiteで全対象draftを検証しており、$ref/allOf/anyOf/oneOf/
# patternProperties/formatを含め仕様への準拠度が高い。1.5.x系（枯れたJackson 2ベースの
# 旧来API、JsonSchemaFactory/ValidationMessage）を選択する。2.x/3.x系はJackson 3への
# 全面書き換えで本稿執筆時点（2026-08-21）でリリース後1日未満のため、セキュリティ境界の
# 検証には実績不足として避ける（GitHub Releases公開日で確認済み）。
json-schema-validator = "1.5.9"
# ADR-0017: apap-engine全体で使用するJSONライブラリはJacksonに一本化する（プロジェクト全体の決定。
# kotlinx-serialization/Gson/org.json等の別スタックを追加しないこと。追加が必要な場合はADR-0017を
# Supersedeする新規ADRを起票すること）。バージョンは埋込先prompt-engine（別リポジトリ、
# gradle/libs.versions.tomlのjacksonエントリ）の実宣言値と手動で揃える。ズレを見つけたら
# このバージョンをprompt-engine側に追従させ、ADR-0017の「見直す条件」に該当しないか確認すること。
jackson = "2.22.1"
# CLAUDE.md不変条件6: apap-runtime/apap-domainにはAPIのみ持ち込み、SDKは宿主が注入する。
# apap-observabilityのMetrics/TracingはOpenTelemetry API（opentelemetry-api）のみをimplementation
# 依存とする。opentelemetry-sdk/opentelemetry-sdk-testingはapap-observability自身のテストでのみ
# （実SDKに対してMeter/Tracer呼出が正しく機能することを検証するため）testImplementationとして使う。
opentelemetry = "1.64.0"
# ADR-0025: apap-infrastructureのJDBC Repository実装が対象とするRDBMS/マイグレーションツール。
# バージョンは埋込先prompt-engine（別リポジトリ、gradle/libs.versions.tomlのflywayエントリ）の
# 実宣言値と揃える（ADR-0017と同じ「実ホストを確認してから決める」方式）。
flyway = "13.3.0"
# prompt-engine側はSpring Boot BOM管理下でバージョン省略しているため、apap-infrastructure
# （Spring Boot非依存、CLAUDE.md不変条件6）では明示的に固定する。2026-08-29時点の最新安定版。
postgresql = "42.7.9"
# ADR-0025: 分散CircuitBreakerStateStore/RateLimitCounterStore/CacheStore実装が使うRedisクライアント。
# prompt-engine側のRedisPromptCache（ADR-0033決定d）と同じ技術。バージョンはpostgresqlと同様、
# Spring Boot BOM非依存のため明示固定（2026-08-29時点の最新安定版）。
lettuce = "7.6.0.RELEASE"
# P10 gateway/apap-gateway: HTTP/SSEサーバ。ADR-0003で対応トランスポートはREST/SSEのみと決定済み。
# JSONはADR-0017に従いJacksonへ一本化する（ktor-serialization-jacksonを使い、
# kotlinx-serializationは持ち込まない）。CLAUDE.md不変条件6はapap-runtimeとその依存に対する制約で、
# Presentation層であるgatewayはこの制約の対象外（Gatewayはmodules/の外に置かれている）。
ktor = "3.4.0"
# CIAP発行JWTの検証（ADR-0004）。TokenVerifier interfaceの背後に閉じ込め、CIAP固有の詳細を
# Gatewayの他の部分へ漏らさない。jwks-rsaはJWKS取得とキャッシュ（TTL/レートリミット）を提供する。
auth0-java-jwt = "4.5.0"
auth0-jwks-rsa = "0.22.1"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist-lib" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# CLAUDE.md「時刻・ID」規約: delay()を含むsuspend関数のテストはrunTest/TestCoroutineSchedulerで
# 仮想時間を使い、実時間sleepに依存しないこと（ADR-0024後続、TokenBucketRateLimiterTest flaky対応）。
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
# Kotlin data class（プライマリコンストラクタ・デフォルト値・null許容）を正しく(逆)シリアライズする
# ために必要。prompt-engine側も同じモジュールを使用（ADR-0025と同じ「実ホスト確認」方式）。
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
# java.time.Instant等のJSR-310型はkotlin-moduleだけでは扱えない（別モジュール、Jackson側の仕様）。
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing", version.ref = "opentelemetry" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-id = { module = "io.ktor:ktor-server-call-id", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
java-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0-java-jwt" }
jwks-rsa = { module = "com.auth0:jwks-rsa", version.ref = "auth0-jwks-rsa" }

# build-logic（Convention Plugin）が implementation として使う、プラグイン本体の座標
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
